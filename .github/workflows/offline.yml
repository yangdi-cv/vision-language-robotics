name: CPU interfaces and maintained runtime
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev-lock.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python scripts/check_engineering.py --out /tmp/engineering_checks.json
      - run: python scripts/check_offline.py --out /tmp/offline_checks.json
